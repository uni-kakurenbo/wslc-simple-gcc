[workspace]
members = ["crates/wslc-runtime", "crates/wslc-simple-gcc"]
default-members = ["crates/wslc-simple-gcc"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/uni-kakurenbo/wslc-simple-gcc"

[workspace.dependencies]
wslc-runtime = { path = "crates/wslc-runtime" }
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
